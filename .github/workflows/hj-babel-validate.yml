name: HJ Babel Validate
on:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Babel
        run: npm install --no-save @babel/core @babel/preset-env @babel/preset-react
      - name: Validate HJ versions and publish statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs'), cp=require('child_process'), https=require('https');
          const {transformSync}=require('@babel/core');
          const refs=[
            ['baseline-ab5','ab5bc17170bcb3dfa138708915e5085362956e22'],
            ['first-a5e2','a5e2c565eb21eac67c0588baf576b4151c6ffb85'],
            ['cleanup-1b53','1b53c9bffc46ee5e9fb1b98177434bdbc385a566'],
            ['current','HEAD']
          ];
          function post(context,state,description){
            return new Promise((resolve,reject)=>{
              const body=JSON.stringify({state,context:'hj-babel-'+context,description:String(description).replace(/\s+/g,' ').slice(0,135)});
              const req=https.request({hostname:'api.github.com',path:'/repos/'+process.env.REPO+'/statuses/'+process.env.SHA,method:'POST',headers:{
                Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'hj-babel-validate','Accept':'application/vnd.github+json','Content-Type':'application/json','Content-Length':Buffer.byteLength(body)
              }},res=>{res.resume();res.on('end',resolve);});
              req.on('error',reject);req.write(body);req.end();
            });
          }
          (async()=>{
            let anyFail=false;
            for(const [name,ref] of refs){
              let html;
              try{ html=ref==='HEAD'?fs.readFileSync('index.html','utf8'):cp.execFileSync('git',['show',ref+':index.html'],{encoding:'utf8'}); }
              catch(e){ await post(name,'error','git show failed: '+e.message); anyFail=true; continue; }
              const m=html.match(/<script[^>]*type=["']text\/babel["'][^>]*>([\s\S]*?)<\/script>/i);
              try{
                if(!m) throw new Error('text/babel script not found');
                transformSync(m[1],{presets:['@babel/preset-env','@babel/preset-react'],filename:name+'.jsx'});
                await post(name,'success','Babel OK');
              }catch(e){
                anyFail=true;
                const loc=e.loc?(' line '+e.loc.line+':'+e.loc.column):'';
                await post(name,'failure',(e.reasonCode||'Babel error')+loc+' '+(e.message||e));
              }
            }
            process.exit(anyFail?1:0);
          })().catch(e=>{console.error(e);process.exit(2);});
          NODE
